<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Ütübüs | Ütünüz, Ütümüz.</title>
  <meta name="description" content="Ütübüs, Başakşehir'de kapınızdan aldığı kıyafetleri özenle ütüleyip tekrar teslim eden kapıdan kapıya ütü hizmetidir. Çok yakında." />
  <meta name="theme-color" content="#4F2DD7" />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f7f5ff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
    }

    .wrap {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: linear-gradient(135deg, #ffffff 0%, #f4f0ff 100%);
    }

    .hero {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1920px;
      max-height: 100svh;
      object-fit: contain;
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 12px;
      }

      .hero {
        max-height: none;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(56, 26, 121, 0.12);
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <img
      class="hero"
      src="utubus-banner-web.jpg"
      alt="Ütübüs - Başakşehir'de çok yakında kapıdan kapıya ütü hizmeti"
    />
  </main>
</body>
</html>
